name: Update auth package lock on implementation branch
on:
  push:
    branches: [implementation/analysis-gap-closure-20261022]
    paths: [.github/workflows/refresh-auth-lock.yml]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible package-lock
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only dependency lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(web): lock exact Auth.js OIDC integration dependency"
            git push origin HEAD:implementation/analysis-gap-closure-20261022
          fi
