name: One-time Phase 10 formatting
on:
  push:
    branches: [phase-10-evaluation-domain-shift-20261014]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --python 3.11 --frozen --all-groups
      - run: |
          uv run --frozen ruff format services/learning/evaluation.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(phase10): format evaluation pipeline"
            git push origin HEAD:phase-10-evaluation-domain-shift-20261014
          fi
