name: Phase 0 architecture contracts

on:
  pull_request:
  push:
    branches: [main, phase-0-architecture-foundation]

permissions:
  contents: read

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Phase 0 test tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Structural and schema validation
        run: python scripts/validate_phase0.py
      - name: Contract tests
        run: python -m pytest -q
