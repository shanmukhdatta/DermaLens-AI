name: Temporary Phase 9 Ruff formatter
on:
  push:
    branches: [phase-9-model-artifact-adapter-20261014]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'shanmukhdatta/DermaLens-AI' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --python 3.11 --frozen --all-groups
      - name: Fix and format the feature branch
        run: |
          uv run --frozen ruff check . --fix || true
          uv run --frozen ruff format .
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(phase9): format model adapter"
            git push origin HEAD:phase-9-model-artifact-adapter-20261014
          fi
